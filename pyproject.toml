[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tideway"
version = "0.1.0"
description = "Phase-aware tiered memory management for MoE inference"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]
license-files = ["LICENSE-FreeToken", "NOTICE"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tideway = ["*.c"]
"tideway.baselines.expert_paging" = ["*.c", "*.cu"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
